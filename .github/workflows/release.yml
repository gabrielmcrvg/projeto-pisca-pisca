# Gera o instalador e a versão portátil do CorollaHUB para Windows.
# Como usar: crie uma tag de versão (ex.: v1.0.1) e envie para o GitHub:
#   git tag v1.0.1
#   git push origin v1.0.1
# O GitHub monta os .exe e publica numa Release com o mesmo nome.
name: Gerar .exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Usar a versão da tag no app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Gerar instalador e versão portátil
        run: npm run dist

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          generate_release_notes: true

      - name: Guardar os arquivos (execução manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: CorollaHUB-windows
          path: dist/*.exe
